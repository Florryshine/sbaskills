<svg role="img" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="volcanoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d63031;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lavaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffeaa7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fdcb6e;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="cloudGrad">
      <stop offset="0%" style="stop-color:#74b9ff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#0984e3;stop-opacity:0.6" />
    </radialGradient>
    <radialGradient id="smokeGrad">
      <stop offset="0%" style="stop-color:#dfe6e9;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#b2bec3;stop-opacity:0.3" />
    </radialGradient>
  </defs>
  
  <!-- Ground -->
  <path d="M0 380 Q128 360 256 370 Q384 360 512 380 L512 512 L0 512 Z" fill="#55a3ff" stroke="#3d2f52" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Volcano body -->
  <path d="M150 380 Q180 250 256 200 Q332 250 360 380 Z" fill="url(#volcanoGrad)" stroke="#3d2f52" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Crater -->
  <ellipse cx="256" cy="200" rx="40" ry="20" fill="#ff7675" stroke="#3d2f52" stroke-width="3"/>
  
  <!-- Lava flow -->
  <path d="M230 210 Q240 240 250 270 Q260 240 270 210" fill="url(#lavaGrad)" stroke="#3d2f52" stroke-width="3" stroke-linejoin="round"/>
  <path d="M235 220 Q245 250 255 280 Q265 250 275 220" fill="none" stroke="#fdcb6e" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Lava droplets -->
  <circle cx="240" cy="290" r="8" fill="url(#lavaGrad)" stroke="#3d2f52" stroke-width="2"/>
  <circle cx="255" cy="300" r="6" fill="url(#lavaGrad)" stroke="#3d2f52" stroke-width="2"/>
  <circle cx="270" cy="290" r="7" fill="url(#lavaGrad)" stroke="#3d2f52" stroke-width="2"/>
  
  <!-- Smoke clouds -->
  <ellipse cx="240" cy="180" rx="25" ry="15" fill="url(#smokeGrad)" stroke="#3d2f52" stroke-width="2"/>
  <ellipse cx="256" cy="170" rx="30" ry="18" fill="url(#smokeGrad)" stroke="#3d2f52" stroke-width="2"/>
  <ellipse cx="272" cy="180" rx="25" ry="15" fill="url(#smokeGrad)" stroke="#3d2f52" stroke-width="2"/>
  
  <!-- Ash cloud -->
  <ellipse cx="256" cy="140" rx="50" ry="25" fill="url(#cloudGrad)" stroke="#3d2f52" stroke-width="3"/>
  
  <!-- Sun -->
  <circle cx="400" cy="100" r="40" fill="#ffeaa7" stroke="#3d2f52" stroke-width="4"/>
  <path d="M400 40 L400 60 M400 140 L400 160 M460 100 L440 100 M360 100 L340 100 M440 60 L428 72 M384 128 L372 140 M372 60 L384 72 M428 128 L440 140" stroke="#3d2f52" stroke-width="4" stroke-linecap="round"/>
  
  <!-- Cute volcano face -->
  <circle cx="235" cy="300" r="5" fill="#2d3436"/>
  <circle cx="277" cy="300" r="5" fill="#2d3436"/>
  <path d="M240 320 Q256 330 272 320" fill="none" stroke="#2d3436" stroke-width="3" stroke-linecap="round"/>
</svg>