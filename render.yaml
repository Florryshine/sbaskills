services:
  - type: worker
    name: sba-whiteboard-renderer
    runtime: docker
    dockerfilePath: ./local-video-renderer/Dockerfile
    dockerContext: .
    plan: starter
    region: frankfurt
    maxShutdownDelaySeconds: 300
    autoDeployTrigger: commit
    envVars:
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TTS_ENDPOINT
        value: https://openai-edge-tts-aqq1.onrender.com
      - key: WHITEBOARD_WORKER_POLL_MS
        value: "15000"
      - key: WHITEBOARD_WORKER_HEARTBEAT_MS
        value: "30000"
