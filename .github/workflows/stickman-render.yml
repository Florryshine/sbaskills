name: Stickman renderer

# Free, on-demand queue runner matching the Whiteboard renderer.
# GitHub Actions checks the Supabase queue every 5 minutes, runs one job,
# then exits. No always-on Render worker is required.
on:
  push:
    paths:
      - '.github/workflows/stickman-render.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [stickman-job]

concurrency:
  group: stickman-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TTS_ENDPOINT: ${{ secrets.TTS_ENDPOINT }}
      STICKMAN_RUN_ONCE: '1'
      STICKMAN_WORKER_HEARTBEAT_MS: '30000'
      STICKMAN_RUN_ONCE_MAX_MS: '2400000'

    steps:
      - name: Check for waiting or abandoned Stickman jobs
        id: check
        shell: bash
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Repo secrets NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY are not set."
            exit 1
          fi
          cutoff=$(date -u -d '5 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')
          body=$(curl -sS --fail-with-body --get \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/stickman_jobs" \
            --data-urlencode "select=id" \
            --data-urlencode "status=in.(queued,narrating,rendering)" \
            --data-urlencode "or=(claim_token.is.null,heartbeat_at.is.null,heartbeat_at.lt.$cutoff)" \
            --data-urlencode "limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY") || { echo "::error::Supabase query failed: $body"; exit 1; }
          if [ "$body" = "[]" ]; then
            echo "No waiting Stickman jobs."
            echo "has_jobs=false" >> "$GITHUB_OUTPUT"
          else
            echo "Stickman jobs waiting."
            echo "has_jobs=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.has_jobs == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.has_jobs == 'true'
        with:
          node-version: 24
          cache: npm

      - uses: oven-sh/setup-bun@v2
        if: steps.check.outputs.has_jobs == 'true'

      - name: Install Chrome system libraries
        if: steps.check.outputs.has_jobs == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2t64 \
            libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 \
            libpango-1.0-0 libcairo2 libcups2 fonts-dejavu-core

      - name: Install application dependencies
        if: steps.check.outputs.has_jobs == 'true'
        run: npm ci --omit=dev

      - name: Install Stickman engine dependencies and Chromium
        if: steps.check.outputs.has_jobs == 'true'
        run: |
          cd stickman-engine
          bun install
          cd ..
          ./node_modules/.bin/remotion browser ensure

      - name: Render queued Stickman job
        if: steps.check.outputs.has_jobs == 'true'
        run: bun local-video-renderer/stickman-worker.js
