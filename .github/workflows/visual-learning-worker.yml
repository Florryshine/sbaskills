name: Visual Learning Worker

# Renders Visual Learning Engine episodes on the free GitHub Actions runner
# (same dispatch pattern as the stickman worker). The job table is drained
# with VISUAL_LEARNING_RUN_ONCE=1 and the runner exits.

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Optional job id to render (empty = drain the whole queue)'
        required: false
        default: ''
  repository_dispatch:
    types: [visual-learning-render]

concurrency:
  group: visual-learning-worker
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Chrome for Remotion
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser
          echo "CHROME_PATH=$(which chromium-browser)" >> "$GITHUB_ENV"

      - name: Install engine deps
        run: cd visual-learning-engine && bun install

      - name: Render queued jobs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TTS_ENDPOINT: ${{ secrets.TTS_ENDPOINT }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          VL_NARRATION_PROVIDER: proxy
          VISUAL_LEARNING_RUN_ONCE: '1'
          VISUAL_LEARNING_RUN_ONCE_MAX_MS: '2700000'
          REMOTION_CONCURRENCY: '2'
        run: bun local-video-renderer/visual-learning-worker.js
