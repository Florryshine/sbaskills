name: Visual Learning Worker

# Queue-backed free renderer. GitHub-hosted runners are ephemeral, so this
# workflow wakes every five minutes, checks Supabase, renders waiting jobs,
# and exits. It can also be started manually or by repository_dispatch.

on:
  push:
    paths:
      - '.github/workflows/visual-learning-worker.yml'
      - 'local-video-renderer/visual-learning-worker.js'
      - 'visual-learning-engine/**'
      - 'lib/visual-learning/**'
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      job_id:
        description: 'Optional job id (the worker drains the queue when omitted)'
        required: false
        default: ''
  repository_dispatch:
    types: [visual-learning-render]

concurrency:
  group: visual-learning-worker
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TTS_ENDPOINT: ${{ secrets.TTS_ENDPOINT }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      VL_NARRATION_PROVIDER: proxy
      VISUAL_LEARNING_RUN_ONCE: '1'
      VISUAL_LEARNING_RUN_ONCE_MAX_MS: '2700000'
      REMOTION_CONCURRENCY: '2'

    steps:
      - name: Check for waiting or abandoned Visual Learning jobs
        id: check
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Repo secrets NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY are not set."
            exit 1
          fi
          cutoff=$(date -u -d '8 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')
          body=$(curl -sS --fail-with-body --get \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/visual_learning_jobs" \
            --data-urlencode "select=id" \
            --data-urlencode "status=in.(queued,scripting,imagery,narrating,timeline,rendering,saving)" \
            --data-urlencode "or=(claim_token.is.null,heartbeat_at.is.null,heartbeat_at.lt.$cutoff)" \
            --data-urlencode "limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY")
          if [ "$body" = "[]" ]; then
            echo "No waiting Visual Learning jobs."
            echo "has_jobs=false" >> "$GITHUB_OUTPUT"
          else
            echo "Visual Learning jobs are waiting."
            echo "has_jobs=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.has_jobs == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.has_jobs == 'true'
        with:
          node-version: 24
          cache: npm

      - uses: oven-sh/setup-bun@v2
        if: steps.check.outputs.has_jobs == 'true'
        with:
          bun-version: latest

      - name: Install application dependencies
        if: steps.check.outputs.has_jobs == 'true'
        run: npm ci --omit=dev

      - name: Install Visual Learning engine dependencies
        if: steps.check.outputs.has_jobs == 'true'
        run: cd visual-learning-engine && bun install --frozen-lockfile --production

      - name: Install Chrome system libraries and browser
        if: steps.check.outputs.has_jobs == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2t64 \
            libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 \
            libpango-1.0-0 libcairo2 libcups2 fonts-dejavu-core
          ./node_modules/.bin/remotion browser ensure

      - name: Render queued Visual Learning jobs
        if: steps.check.outputs.has_jobs == 'true'
        run: bun local-video-renderer/visual-learning-worker.js
