name: Stickman Image Presenter tests

on:
  pull_request:
    paths:
      - "stickman-engine/**"
      - "local-video-renderer/stickman-worker.js"
      - "local-video-renderer/tests/**"
      - "app/api/admin/stickman-image-presenter/**"
      - ".github/workflows/stickman-image-presenter-test.yml"
  workflow_dispatch:

jobs:
  worker-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install root worker dependencies
        run: npm ci
      - name: Install Stickman engine dependencies
        working-directory: stickman-engine
        run: bun install
      - name: Install Chromium system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2t64 libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 fonts-dejavu-core
      - name: Install Remotion Chromium
        working-directory: stickman-engine
        run: bunx remotion browser ensure
      - name: Render actual MP4 smoke tests for all four modes
        working-directory: stickman-engine
        run: bun src/image-presenter/smoke.ts
      - name: Run worker regression suite including all four Image Presenter modes
        run: bash local-video-renderer/tests/run-stickman.sh
