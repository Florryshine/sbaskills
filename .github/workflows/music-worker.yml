name: Musical Learning background renderer

on:
  push:
    branches: [master]
    paths:
      - 'local-video-renderer/music-worker.js'
      - 'lib/studio/background-entry.ts'
      - 'lib/studio/tts.ts'
      - '.github/workflows/music-worker.yml'
  repository_dispatch:
    types: [music-render-job]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && format('music-worker-validation-{0}', github.run_id) || 'music-render-queue-v3' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push'
    name: Validate background renderer code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - name: Install production dependencies
        run: npm ci --omit=dev
      - name: Validate worker and browser entry
        run: |
          node --check local-video-renderer/music-worker.js
          bun build lib/studio/background-entry.ts --target=browser --format=iife --outdir=/tmp/sba-music-bundle-check

  render:
    if: github.event_name != 'push'
    name: Claim and render a queued learning song
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      TTS_ENDPOINT: ${{ secrets.TTS_ENDPOINT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GEMINI_TTS_MODEL: ${{ secrets.GEMINI_TTS_MODEL }}
      GEMINI_TTS_VOICE_A: ${{ secrets.GEMINI_TTS_VOICE_A }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install production dependencies
        run: npm ci --omit=dev
      - name: Install headless Chromium for Remotion
        run: npx remotion browser ensure
      - name: Validate worker and browser entry
        run: |
          node --check local-video-renderer/music-worker.js
          bun build lib/studio/background-entry.ts --target=browser --format=iife --outdir=/tmp/sba-music-bundle-check
      - name: Claim and render one song
        run: bun local-video-renderer/music-worker.js
