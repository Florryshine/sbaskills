name: Remotion dependency alignment

on:
  push:
    branches:
      - feat/tegaki-engine-phase-1
    paths:
      - package.json
      - .github/workflows/dependency-lock-repair.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/tegaki-engine-phase-1
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Regenerate package lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify clean install
        run: npm ci
      - name: Verify a single Remotion version
        run: |
          npm ls remotion @remotion/cli @remotion/player @remotion/renderer @remotion/bundler --all
          node -e "const p=require('./package-lock.json'); const versions=Object.entries(p.packages).filter(([k,v])=>k==='node_modules/remotion'||k.endsWith('/node_modules/remotion')).map(([k,v])=>[k,v.version]); console.log(versions); if(new Set(versions.map(x=>x[1])).size!==1) process.exit(1)"
      - name: Commit reconciled lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already current"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(deps): regenerate lockfile with aligned Remotion versions"
            git push origin HEAD:feat/tegaki-engine-phase-1
          fi
