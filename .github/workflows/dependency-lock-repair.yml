name: Dependency lockfile repair

on:
  push:
    branches:
      - feat/tegaki-engine-phase-1
    paths:
      - package.json
      - .github/workflows/dependency-lock-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-lock-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: feat/tegaki-engine-phase-1
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Regenerate lockfile from the complete package manifest
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify clean npm installation
        run: npm ci

      - name: Verify critical dependency versions
        run: npm ls next react react-dom jszip @swavoti/next-pwa --depth=0

      - name: Commit the reconciled lockfile
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json already matches package.json"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "fix(deps): regenerate lockfile for current app manifest"
            git push origin HEAD:feat/tegaki-engine-phase-1
          fi

      - name: Run Tegaki engine tests
        run: |
          npm run test:tegaki-styles
          npm run test:tegaki-composition
          npm run test:tegaki-audio
          npm run test:tegaki-export

      - name: Run production build
        run: npm run build

      - name: Verify production-only install used by worker Dockerfile
        run: npm ci --omit=dev

      - name: Install Whiteboard engine dependencies
        working-directory: whiteboard-engine
        run: bun install --frozen-lockfile --production

      - name: Run Whiteboard worker scenarios
        run: ./local-video-renderer/tests/run-all.sh
