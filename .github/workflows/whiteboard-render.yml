name: Whiteboard renderer

# Free renderer for Whiteboard Studio jobs (replaces a paid always-on Render worker).
# Every 5 minutes (and on demand) it checks Supabase for waiting jobs. If there are none it
# exits in seconds. If there are, it runs the SAME worker code in run-once mode, which does the
# narration + Remotion/Chrome render + upload, then exits.
#
# Repo secrets required (Settings → Secrets and variables → Actions):
#   NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, GEMINI_API_KEY
# Optional: GROQ_API_KEY, OPENROUTER_API_KEY, TTS_ENDPOINT

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [whiteboard-job]

# One renderer at a time; never cancel a render that is in progress.
concurrency:
  group: whiteboard-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      TTS_ENDPOINT: ${{ secrets.TTS_ENDPOINT }}
      WHITEBOARD_RUN_ONCE: '1'
      WHITEBOARD_WORKER_HEARTBEAT_MS: '30000'
    steps:
      - name: Any whiteboard jobs waiting?
        id: check
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Repo secrets NEXT_PUBLIC_SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY are not set."
            exit 1
          fi
          body=$(curl -sS --fail-with-body \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/whiteboard_jobs?select=id&status=in.(narrating,rendering)&limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY") || { echo "::error::Supabase query failed: $body"; exit 1; }
          if [ "$body" = "[]" ]; then
            echo "No waiting jobs."
            echo "has_jobs=false" >> "$GITHUB_OUTPUT"
          else
            echo "Jobs waiting."
            echo "has_jobs=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.has_jobs == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.has_jobs == 'true'
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        if: steps.check.outputs.has_jobs == 'true'

      - name: Install Chrome system libraries
        if: steps.check.outputs.has_jobs == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2t64 \
            libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 \
            libpango-1.0-0 libcairo2 libcups2 fonts-dejavu-core

      - name: Install dependencies
        if: steps.check.outputs.has_jobs == 'true'
        run: |
          npm ci --omit=dev
          cd whiteboard-engine
          bun install --frozen-lockfile --production
          ./node_modules/.bin/remotion browser ensure

      - name: Render waiting jobs
        if: steps.check.outputs.has_jobs == 'true'
        run: bun local-video-renderer/whiteboard-worker.js
