name: Tegaki renderer

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [tegaki-job]

concurrency:
  group: tegaki-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      TTS_ENDPOINT: ${{ secrets.TTS_ENDPOINT }}
      TEGAKI_RUN_ONCE: '1'
      TEGAKI_WORKER_HEARTBEAT_MS: '30000'
    steps:
      - name: Check for queued or abandoned Tegaki exports
        id: check
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing Supabase repository secrets."
            exit 1
          fi
          cutoff=$(date -u -d '5 minutes ago' '+%Y-%m-%dT%H:%M:%SZ')
          body=$(curl -sS --fail-with-body --get "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/tegaki_jobs" \
            --data-urlencode "select=id" \
            --data-urlencode "status=in.(queued,rendering,uploading)" \
            --data-urlencode "or=(stage.eq.queued,heartbeat_at.is.null,heartbeat_at.lt.$cutoff)" \
            --data-urlencode "limit=1" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY") || { echo "::error::Supabase query failed: $body"; exit 1; }
          if [ "$body" = "[]" ]; then
            echo "No Tegaki exports waiting."
            echo "has_jobs=false" >> "$GITHUB_OUTPUT"
          else
            echo "Tegaki exports waiting."
            echo "has_jobs=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.has_jobs == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.has_jobs == 'true'
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
        if: steps.check.outputs.has_jobs == 'true'
      - name: Install Chrome system libraries
        if: steps.check.outputs.has_jobs == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libnss3 libdbus-1-3 libatk1.0-0 libgbm1 libasound2t64 \
            libxrandr2 libxkbcommon0 libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 \
            libpango-1.0-0 libcairo2 libcups2 fonts-dejavu-core
      - name: Install dependencies and Remotion browser
        if: steps.check.outputs.has_jobs == 'true'
        run: |
          npm ci --omit=dev
          npx remotion browser ensure
      - name: Render Tegaki exports
        if: steps.check.outputs.has_jobs == 'true'
        run: bun local-video-renderer/tegaki-worker.js
