name: Stickman queue worker

on:
  repository_dispatch:
    types: [stickman-job]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stickman-render-queue
  cancel-in-progress: false

jobs:
  render:
    name: Claim and render queued Stickman jobs
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
      GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
      GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_API_KEY_1: ${{ secrets.GROQ_API_KEY_1 }}
      GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
      GROQ_API_KEY_3: ${{ secrets.GROQ_API_KEY_3 }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HUGGINGFACE_API_KEY: ${{ secrets.HUGGINGFACE_API_KEY }}
      TTS_ENDPOINT: ${{ secrets.TTS_ENDPOINT }}
      GEMINI_TTS_MODEL: ${{ secrets.GEMINI_TTS_MODEL }}
      GEMINI_TTS_VOICE_A: ${{ secrets.GEMINI_TTS_VOICE_A }}
      GEMINI_TTS_VOICE_B: ${{ secrets.GEMINI_TTS_VOICE_B }}
      STICKMAN_RUN_ONCE: "1"
      STICKMAN_RUN_ONCE_MAX_MS: "2400000"
      STICKMAN_AUTO_PUBLISH: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install system renderer dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          echo "CHROME_PATH=" >> "$GITHUB_ENV"

      - name: Install application dependencies
        run: npm ci --omit=dev

      - name: Install Stickman engine dependencies
        working-directory: stickman-engine
        run: bun install --frozen-lockfile --production

      - name: Install Remotion Chromium
        run: npx remotion browser ensure

      - name: Validate worker syntax
        run: node --check local-video-renderer/stickman-worker.js

      - name: Run Stickman queue worker
        run: bun local-video-renderer/stickman-worker.js
